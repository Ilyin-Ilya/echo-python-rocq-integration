[metadata]
name = distributed-simulations
version = attr: distributed_simulations._version.__version__
description = Single-process emulation of message-passing distributed algorithms
long_description = file: README.md
long_description_content_type = text/markdown
keywords = distributed-systems, formal-verification, rocq, simulation
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Typing :: Typed

[options]
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
include = distributed_simulations*
exclude = distributed_simulations.migration*

[options.package_data]
distributed_simulations = py.typed

[options.entry_points]
console_scripts =
    distributed-simulations = distributed_simulations.cli:main
    check-echo-trace = distributed_simulations.algorithms.echo_trace:main
    explore-echo = distributed_simulations.algorithms.echo_explorer:main
    evaluate-echo = distributed_simulations.algorithms.echo_evaluation:main
